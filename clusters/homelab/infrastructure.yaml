apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure
  prune: true
  wait: true
  # decryption.provider: sops wiring intentionally omitted for now —
  # the age private key lives on another machine, not this one yet.
  # Once ~/.config/talhelper/age.key exists here, run:
  #   cat ~/.config/talhelper/age.key | kubectl create secret generic sops-age -n flux-system --from-file=age.agekey=/dev/stdin
  # then add:
  #   decryption:
  #     provider: sops
  #     secretRef:
  #       name: sops-age
