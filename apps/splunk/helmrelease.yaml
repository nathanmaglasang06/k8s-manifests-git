apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: splunk
  namespace: flux-system
spec:
  targetNamespace: monitoring
  releaseName: splunk
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/hostname: g4
        containers:
          main:
            image:
              repository: splunk/splunk
              tag: latest
            env:
              SPLUNK_START_ARGS: --accept-license
              SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
              SPLUNK_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: splunk-admin
                    key: password
            resources:
              requests: { cpu: 2000m, memory: 4Gi }
              limits: { cpu: 4000m, memory: 8Gi }

    service:
      web:
        controller: main
        primary: true
        ports:
          http:
            port: 8000
      mgmt:
        controller: main
        ports:
          mgmt:
            port: 8089
      syslog:
        controller: main
        type: LoadBalancer
        ports:
          syslog:
            port: 514
            protocol: UDP
            targetPort: 9514

    ingress:
      main:
        enabled: true
        className: nginx
        hosts:
          - host: splunk.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: web
                  port: http

    persistence:
      var:
        type: hostPath
        hostPath: /var/lib/splunk/var
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /opt/splunk/var
      etc:
        type: hostPath
        hostPath: /var/lib/splunk/etc
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /opt/splunk/etc
