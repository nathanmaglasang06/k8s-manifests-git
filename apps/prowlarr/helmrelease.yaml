apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: prowlarr
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/hostname: g3
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: latest
            env:
              PUID: "977"
              PGID: "988"
              TZ: "Australia/Sydney"
            resources:
              requests: { cpu: 500m, memory: 512Mi }
              limits: { cpu: 1500m, memory: 2Gi }

    service:
      main:
        ports:
          main:
            port: 9696

    ingress:
      main:
        enabled: true
        className: nginx
        hosts:
          - host: prowlarr.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: main

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /var/lib/media-config/prowlarr
        globalMounts:
          - path: /config
