apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: navidrome
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        # Never let two pods open the SQLite DB at once
        strategy: Recreate
        pod:
          # /data is a hostPath on this node (SQLite on NFS hung repeatedly)
          nodeSelector:
            kubernetes.io/hostname: g4
        containers:
          main:
            image:
              repository: deluan/navidrome
              tag: latest
            env:
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
              TZ: "Australia/Sydney"
              # Metadata/artwork agents, tried in order. apple-music and
              # coverartarchive are .ndp plugins in /data/plugins (hostPath on g4).
              ND_AGENTS: "apple-music,coverartarchive,deezer,lastfm,listenbrainz"
            resources:
              requests: { cpu: 250m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 1Gi }

    service:
      main:
        ports:
          main:
            port: 4533

    ingress:
      main:
        enabled: true
        className: nginx
        hosts:
          - host: navidrome.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: main

    persistence:
      # Node-local: SQLite over NFS (nolock) hangs in nfs_iocounter_wait.
      # Not on the NAS: g4 EPHEMERAL (/var/lib — /var/mnt is read-only to kubelet on Talos).
      data:
        enabled: true
        type: hostPath
        hostPath: /var/lib/navidrome
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /data
      music:
        enabled: true
        existingClaim: media-data
        globalMounts:
          - path: /music
            subPath: music
            readOnly: true
