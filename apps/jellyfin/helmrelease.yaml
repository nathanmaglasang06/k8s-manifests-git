apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: jellyfin
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/hostname: g3
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/jellyfin
              tag: latest
            env:
              PUID: "977"
              PGID: "988"
              TZ: "Australia/Sydney"
              # Intel OpenCL runtime, used for HDR -> SDR tonemapping on the GPU
              DOCKER_MODS: "linuxserver/mods:jellyfin-opencl-intel"
            # Needed to open /dev/dri for Intel QuickSync. No device plugin here
            # (the Intel operator needs cert-manager), so privileged it is.
            securityContext:
              privileged: true
            resources:
              requests: { cpu: 2000m, memory: 3Gi }
              limits: { cpu: 6000m, memory: 6Gi }

    service:
      main:
        ports:
          main:
            port: 8096

    ingress:
      main:
        enabled: true
        className: nginx
        annotations:
          # Forces server-side transcoding (never direct play/stream) for the
          # "tv" user only, by rewriting the PlaybackInfo request body before
          # it reaches Jellyfin. The Samsung Tizen app has no such toggle itself:
          # https://github.com/jellyfin/jellyfin-webos/issues/293
          nginx.ingress.kubernetes.io/configuration-snippet: |
            access_by_lua_block {
              if ngx.req.get_method() == "POST" and string.match(ngx.var.uri, "^/Items/[^/]+/PlaybackInfo$") then
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if body then
                  local cjson = require "cjson.safe"
                  local data = cjson.decode(body)
                  if data then
                    local uid = string.lower(string.gsub(tostring(data.UserId or data.userId or ""), "-", ""))
                    if uid == "d1bdf7051b6045da9d0b213dc7ccf197" then
                      data.EnableDirectPlay = false
                      data.EnableDirectStream = false
                      data.AllowVideoStreamCopy = false
                      data.AllowAudioStreamCopy = false
                      data.EnableTranscoding = true
                      ngx.req.set_body_data(cjson.encode(data))
                    end
                  end
                end
              end
            }
        hosts:
          - host: jellyfin.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: main

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /var/lib/media-config/jellyfin
        globalMounts:
          - path: /config
      # Intel UHD 630 iGPU — needs the siderolabs/i915 Talos extension on the node
      dri:
        enabled: true
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
      media:
        enabled: true
        existingClaim: media-data
        globalMounts:
          - path: /data
