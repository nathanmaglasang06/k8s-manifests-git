apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: jellyfin
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/hostname: g3
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/jellyfin
              tag: latest
            env:
              PUID: "977"
              PGID: "988"
              TZ: "Australia/Sydney"
            resources:
              requests: { cpu: 2000m, memory: 3Gi }
              limits: { cpu: 4000m, memory: 6Gi }

    service:
      main:
        ports:
          main:
            port: 8096

    ingress:
      main:
        enabled: true
        className: nginx
        hosts:
          - host: jellyfin.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: main

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /var/lib/media-config/jellyfin
        globalMounts:
          - path: /config
      media:
        enabled: true
        existingClaim: media-data
        globalMounts:
          - path: /data
