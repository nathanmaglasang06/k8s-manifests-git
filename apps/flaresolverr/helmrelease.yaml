apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: flaresolverr
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            kubernetes.io/hostname: g3
        containers:
          main:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: latest
            env:
              TZ: "Australia/Sydney"
              LOG_LEVEL: "info"
            resources:
              requests: { cpu: 300m, memory: 1Gi }
              limits: { cpu: 1500m, memory: 3Gi }

    service:
      main:
        ports:
          main:
            port: 8191
