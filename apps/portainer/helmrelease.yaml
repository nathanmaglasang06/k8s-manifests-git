apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
  namespace: flux-system
spec:
  targetNamespace: portainer
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: portainer
      version: "245.0.0"
      sourceRef:
        kind: HelmRepository
        name: portainer
        namespace: flux-system
  values:
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: portainer.home.lab
          paths:
            - path: /
    persistence:
      enabled: true
      size: 2Gi
      storageClass: nfs-cluster
