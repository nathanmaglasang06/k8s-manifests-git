# qbittorrent-values.yaml
controllers:
  main:
    pod:
      nodeSelector:
        kubernetes.io/hostname: g3
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
        env:
          PUID: "977"
          PGID: "988"
          TZ: "Australia/Sydney"
          WEBUI_PORT: "8080"
        resources:
          requests: { cpu: 1000m, memory: 2Gi }
          limits: { cpu: 3000m, memory: 4Gi }

service:
  main:
    ports:
      main:
        port: 8080

ingress:
  main:
    enabled: true
    className: nginx
    hosts:
      - host: qbittorrent.home.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: main

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /var/lib/media-config/qbittorrent
    globalMounts:
      - path: /config
  media:
    enabled: true
    existingClaim: media-data
    globalMounts:
      - path: /data