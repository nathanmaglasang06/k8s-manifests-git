controllers:
  main:
    pod:
      nodeSelector:
        kubernetes.io/hostname: g3
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: latest
        env:
          PUID: "977"
          PGID: "988"
          TZ: "Australia/Sydney"
        resources:
          requests: { cpu: 2000m, memory: 3Gi }
          limits: { cpu: 4000m, memory: 6Gi }

service:
  main:
    ports:
      main:
        port: 8096

ingress:
  main:
    enabled: true
    className: nginx
    hosts:
      - host: jellyfin.home.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: main

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /var/lib/media-config/jellyfin
    globalMounts:
      - path: /config
  media:
    enabled: true
    existingClaim: media-data
    globalMounts:
      - path: /data