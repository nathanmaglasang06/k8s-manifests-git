apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot

  services.yaml: |
    - Quick Links:
        - Media:
            - Jellyfin:
                href: http://jellyfin.home.lab
                description: Movies & TV streaming
                siteMonitor: http://jellyfin.home.lab
            - Navidrome:
                href: http://navidrome.home.lab
                description: Music streaming
                siteMonitor: http://navidrome.home.lab
            - Immich:
                href: http://immich.home.lab
                description: Photo library
                siteMonitor: http://immich.home.lab

        - Media Management:
            - Radarr:
                href: http://radarr.home.lab
                description: Movie collection
                siteMonitor: http://radarr.home.lab
            - Sonarr:
                href: http://sonarr.home.lab
                description: TV collection
                siteMonitor: http://sonarr.home.lab
            - Lidarr:
                href: http://lidarr.home.lab
                description: Music collection
                siteMonitor: http://lidarr.home.lab
            - Prowlarr:
                href: http://prowlarr.home.lab
                description: Indexer management
                siteMonitor: http://prowlarr.home.lab
            - Beets:
                href: http://beets.home.lab
                description: Music tagging & organization
                siteMonitor: http://beets.home.lab

        - Infrastructure:
            - Portainer:
                href: http://portainer.home.lab
                description: Cluster visibility
                siteMonitor: http://portainer.home.lab
            - Grafana:
                href: http://grafana.home.lab
                description: Monitoring
                siteMonitor: http://grafana.home.lab
            - Bambuddy:
                href: http://bambuddy.home.lab
                description: 3D printer management
                siteMonitor: http://bambuddy.home.lab

    - Monitoring:
        # widget: blocks intentionally left off both tiles below until real
        # credentials are provided — the unresolved {{HOMEPAGE_VAR_*}}
        # placeholders were being sent as literal username/password every
        # 30s, which got the source IP rate-limited/banned by both
        # qBittorrent and UniFi. Re-add once the Secret is wired in.
        - qBittorrent:
            href: http://qbittorrent.home.lab
            description: Downloads
            siteMonitor: http://qbittorrent.home.lab
        - UNAS Storage:
            href: https://192.168.0.5
            description: NAS storage
            siteMonitor: https://192.168.0.5

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster Total"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  custom.css: |
    /* Move the top info-widgets row (Kubernetes cluster/node stats) below
       the services/links area, and center it. #information-widgets and
       #services are direct siblings in a flex-col container, so a plain
       flex `order` swap is enough — no layout hacks needed. */
    #services {
      order: 1;
    }
    #information-widgets {
      order: 2;
      justify-content: center !important;
    }
    /* #footer has mt-auto by default, which shoves it (and everything
       after it in the reordered flow) down against the bottom of the
       viewport, leaving a big empty gap above. Put it last in the visual
       order instead and drop the auto margin, then center the whole
       content block in the page rather than anchoring it to the top. */
    #footer {
      order: 3;
      margin-top: 0 !important;
    }
    #inner_wrapper > div.min-h-screen {
      justify-content: center;
    }
