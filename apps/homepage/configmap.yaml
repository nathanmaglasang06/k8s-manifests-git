apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: neutral
    headerStyle: clean
    statusStyle: dot

  services.yaml: |
    - Quick Links:
        - Media:
            - Jellyfin:
                icon: jellyfin.png
                href: http://jellyfin.home.lab
                description: Movies & TV streaming
                siteMonitor: http://jellyfin.home.lab
            - Navidrome:
                icon: navidrome.png
                href: http://navidrome.home.lab
                description: Music streaming
                siteMonitor: http://navidrome.home.lab
            - Immich:
                icon: immich.png
                href: http://immich.home.lab
                description: Photo library
                siteMonitor: http://immich.home.lab

        - Media Management:
            - Radarr:
                icon: radarr.png
                href: http://radarr.home.lab
                description: Movie collection
                siteMonitor: http://radarr.home.lab
            - Sonarr:
                icon: sonarr.png
                href: http://sonarr.home.lab
                description: TV collection
                siteMonitor: http://sonarr.home.lab
            - Lidarr:
                icon: lidarr.png
                href: http://lidarr.home.lab
                description: Music collection
                siteMonitor: http://lidarr.home.lab
            - Prowlarr:
                icon: prowlarr.png
                href: http://prowlarr.home.lab
                description: Indexer management
                siteMonitor: http://prowlarr.home.lab
            - Beets:
                icon: beets.png
                href: http://beets.home.lab
                description: Music tagging & organization
                siteMonitor: http://beets.home.lab

        - Infrastructure:
            - Portainer:
                icon: portainer.png
                href: http://portainer.home.lab
                description: Cluster visibility
                siteMonitor: http://portainer.home.lab
            - Grafana:
                icon: grafana.png
                href: http://grafana.home.lab
                description: Monitoring
                siteMonitor: http://grafana.home.lab
            - Bambuddy:
                icon: bambu-lab.png
                href: http://bambuddy.home.lab
                description: 3D printer management
                siteMonitor: http://bambuddy.home.lab

    - Monitoring:
        - qBittorrent:
            icon: qbittorrent.png
            href: http://qbittorrent.home.lab
            description: Downloads
            siteMonitor: http://qbittorrent.home.lab
            widget:
              type: qbittorrent
              url: http://qbittorrent.media.svc.cluster.local:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
        - UNAS Storage:
            icon: unifi.png
            href: https://192.168.0.5
            description: NAS storage
            siteMonitor: https://192.168.0.5
            widget:
              type: unifi_drive
              url: https://192.168.0.5
              username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}"
              password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
        - Cluster Resources:
            icon: kubernetes.png
            description: Total cluster capacity — click for CPU/storage graphs
            href: http://grafana.home.lab/d/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes
            widget:
              type: customapi
              url: http://localhost:3000/api/widgets/kubernetes
              mappings:
                - field: cluster.cpu.total
                  label: Total Cores
                  format: number
                - field: cluster.memory.total
                  label: Total RAM
                  format: bytes
        # widget: blocks intentionally left off both tiles below until API
        # keys exist — same reason as the earlier qBittorrent/UNAS pause:
        # avoid hitting the real service repeatedly with a placeholder key.
        # Jellyfin: Admin Dashboard -> Advanced -> API Keys.
        # Immich: Account Settings -> API Keys (needs server.statistics permission).
        - Jellyfin Library:
            icon: jellyfin.png
            href: http://jellyfin.home.lab
            description: Library counts
        - Immich Stats:
            icon: immich.png
            href: http://immich.home.lab
            description: Photo/video counts & storage

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster Total"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  custom.css: |
    /* Back to default DOM order: info-widgets (Kubernetes cluster/node
       stats) at the top, services below, footer naturally last via its
       own mt-auto — no order overrides needed once we're not fighting
       the default flow.
       Scale the whole widget row up for legibility. transform doesn't
       change layout box size, so pad below it to avoid overlapping the
       services grid that follows. */
    #information-widgets {
      justify-content: center !important;
      transform: scale(1.4);
      transform-origin: top center;
      margin-bottom: 48px;
    }
