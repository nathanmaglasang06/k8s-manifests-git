apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: flux-system
spec:
  targetNamespace: media
  releaseName: homepage
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          # Same NFS-write identity established for immich-postgres: this
          # export only grants write access to 977:988, not root or the
          # image's own default user.
          securityContext:
            runAsUser: 977
            runAsGroup: 988
            fsGroup: 988
        # Homepage self-generates several files (kubernetes.yaml, cache,
        # logs/) directly inside its config dir at startup — it can't run
        # against a read-only ConfigMap mount there. So /app/config is a
        # real writable PVC, and this init container seeds it from the
        # git-managed ConfigMap on every start (overwriting our four
        # managed files, leaving anything Homepage generates itself alone).
        initContainers:
          seed-config:
            image:
              repository: busybox
              tag: "1.36"
            command: ["sh", "-c"]
            args:
              - "cp /seed/*.yaml /config/"
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: latest
            env:
              HOMEPAGE_ALLOWED_HOSTS: "home.home.lab"
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }

    service:
      main:
        ports:
          main:
            port: 3000

    ingress:
      main:
        enabled: true
        className: nginx
        hosts:
          - host: home.home.lab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: main

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: nfs-cluster
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /app/config
      seed:
        enabled: true
        type: configMap
        name: homepage-config
        advancedMounts:
          main:
            seed-config:
              - path: /seed
